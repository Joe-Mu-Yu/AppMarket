name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key (optional)
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keystore="$RUNNER_TEMP/appmarket-release.jks"
          use_debug_signing() {
            echo "::warning::$1 Release APK will use the generated Android debug key. Configure a valid, persistent signing key for update-compatible releases."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          }

          if [[ -z "${SIGNING_KEY:-}" || -z "${KEYSTORE_PASS:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            use_debug_signing "Release signing secrets are incomplete."
            exit 0
          fi

          if ! printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore" 2>/dev/null; then
            use_debug_signing "SIGNING_KEY is not valid Base64."
            exit 0
          fi

          if ! keytool -exportcert \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASS" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/appmarket-signing-check.der" \
            >/dev/null 2>&1; then
            use_debug_signing "The decoded keystore, password, alias, or key password is invalid."
            exit 0
          fi

          {
            echo "KEYSTORE_PATH=$keystore"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "mode=release" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: |
          set -euo pipefail
          ./gradlew :app:android:assembleRelease
          apk_file="$(find app/android/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_file" ]]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          echo "APK_FILE=$apk_file" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AppMarket-APK
          path: ${{ env.APK_FILE }}
          archive: false

      - name: Display APK Hashes
        run: |
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing mode: ${{ steps.signing.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hash Type | Hash Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA256 | $(sha256sum "$APK_FILE" | awk '{ print $1 }') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA1 | $(sha1sum "$APK_FILE" | awk '{ print $1 }') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MD5 | $(md5sum "$APK_FILE" | awk '{ print $1 }') |" >> "$GITHUB_STEP_SUMMARY"
